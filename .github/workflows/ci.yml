name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The Stage 3R.1 baseline generator reads its pinned historical
          # commit, so the CI checkout must include repository history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/happ-decryptor/go.mod
          cache-dependency-path: tools/happ-decryptor/go.sum

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Run Python tests
        run: |
          set -o pipefail
          # Проверки, которые меряют настоящее время, идут отдельно, по потоку на файл:
          # рядом с параллельным прогоном они падают без всякой поломки.
          python -m pytest -q -n auto --dist loadfile -m "not timing" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          python -m pytest -q -n 4 --dist loadfile -m timing 2>&1 | tee -a "$RUNNER_TEMP/pytest.log"

      # Журнал шага виден только участникам репозитория, а заметки — всем:
      # по ним понятно, какой тест упал и с чем, не открывая журнал.
      - name: Name the failed tests
        if: failure()
        run: |
          log="$RUNNER_TEMP/pytest.log"; [ -f "$log" ] || exit 0
          grep -E '^(FAILED|ERROR) ' "$log" | head -n 8 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          details="$(grep -E '^E  ' "$log" | head -n 60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          [ -z "$details" ] || echo "::error title=pytest details::$details"

      - name: Verify frontend build
        run: node scripts/verify_frontend_build.mjs

      - name: Test happ-decryptor
        working-directory: tools/happ-decryptor
        run: |
          go vet ./...
          go test ./...
          # Сборка под архитектуры роутеров ловит то, что не видно на amd64.
          for arch in arm64 mips mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOMIPS=softfloat \
              go build -trimpath -o /dev/null ./cmd/happ-decrypt-universal
          done
